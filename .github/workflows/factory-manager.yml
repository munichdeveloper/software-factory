name: Factory Temporal executor
run-name: SF Temporal ${{ fromJSON(inputs.request).executionId }} ${{ inputs.binding }}
on:
  workflow_dispatch:
    inputs:
      request:
        type: string
        required: true
      binding:
        type: string
        required: true
      validation:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: sf-temporal-${{ fromJSON(inputs.request).executionId }}
  cancel-in-progress: false
jobs:
  code:
    permissions:
      contents: read
      actions: read
    uses: munichdeveloper/software-factory/.github/workflows/temporal-coding-executor.yml@0cbe8b272f2c76b8f4c978b867fe867522a89df1
    with:
      factory-ref: 0cbe8b272f2c76b8f4c978b867fe867522a89df1
      harness-ref: 0e9b20ca3eee4a83db837ebd440111fb52124cec
      request: ${{ inputs.request }}
      validation: ${{ inputs.validation }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
