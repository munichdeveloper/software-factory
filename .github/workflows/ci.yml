name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions: {}
jobs:
  temporal-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build fresh credential-free runtime package
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: docker build --build-arg "FACTORY_SHA=$FACTORY_SHA" -f operations/temporal-runtime/Dockerfile -t sf-temporal-package:ci .
      - name: Verify packaged manifest and produce immutable worker bundle offline
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint node sf-temporal-package:ci -e 'const a=require("node:assert/strict"),p=require("./package.json"),m=require("./temporal-runtime.json");a.equal(p.version,m.factoryVersion);a.equal(m.harness.ref,"c8882950c7a267ae99937aaa048de22e6ecd7492");a.equal(m.experimental,true)'
          docker run --rm --network none sf-temporal-package:ci pack --output /tmp/worker-package --factory-sha "$FACTORY_SHA" --harness-sha c8882950c7a267ae99937aaa048de22e6ecd7492 --harness /app/.runtime/harness/dist/cli.js --deployment sf-rc-package --build "$FACTORY_SHA" --queue sf-rc-package
      # The production stack builds these two targets on the host: the pinned worker with its package baked in,
      # and the broker that takes its release from that package.
      - name: Build the pinned worker and the broker bound to it
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: |
          pinned=$(sed -n 's/^  WORKER_FACTORY_SHA: \([a-f0-9]\{40\}\)$/\1/p' operations/temporal-runtime/compose.production.yaml)
          [[ "$pinned" =~ ^[a-f0-9]{40}$ ]]
          args=(--build-arg "FACTORY_SHA=$FACTORY_SHA" --build-arg "WORKER_FACTORY_SHA=$pinned" --build-arg WORKER_DEPLOYMENT=sf-ci --build-arg WORKER_QUEUE=sf-ci-v1 -f operations/temporal-runtime/Dockerfile)
          docker build "${args[@]}" --target worker -t sf-temporal-worker:ci .
          docker build "${args[@]}" --target broker -t sf-temporal-broker:ci .
          docker run --rm --network none --entrypoint node -e "PINNED=$pinned" sf-temporal-worker:ci -e 'const a=require("node:assert/strict"),c=require("node:crypto"),f=require("node:fs"),p=require("/app/package/worker-package.json");a.equal(p.release.factorySha,process.env.PINNED);a.equal(p.release.buildId,process.env.PINNED);a.equal(c.createHash("sha256").update(f.readFileSync(p.bundlePath)).digest("hex"),p.release.workflowHash);a.equal(c.createHash("sha256").update(f.readFileSync(p.harnessEntrypoint)).digest("hex"),p.harnessEntrypointHash)'
          docker run --rm --network none --entrypoint sh sf-temporal-worker:ci -c 'cat /app/package/worker-package.json' > "$RUNNER_TEMP/worker.json"
          docker run --rm --network none --entrypoint sh sf-temporal-broker:ci -c 'cat "$FACTORY_RELEASE_FILE"' > "$RUNNER_TEMP/broker.json"
          cmp "$RUNNER_TEMP/worker.json" "$RUNNER_TEMP/broker.json"
  temporal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: c8882950c7a267ae99937aaa048de22e6ecd7492
          path: .runtime/harness
          persist-credentials: false
      - name: Fresh Temporal cluster, real Harness, worker crash and approval recovery
        run: python3 scripts/test-runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: temporal-runtime-evidence
          path: .runtime/runtime-acceptance/result.json
          if-no-files-found: ignore
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: munichdeveloper/software-factory
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - id: runtime
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'ref=' + require('./runtime.json').ref + '\n')"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: ${{ steps.runtime.outputs.ref }}
          path: .runtime/harness
          persist-credentials: false
      - working-directory: .runtime/harness
        run: |
          npm ci --ignore-scripts
          npm run build
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:integration
        env:
          HARNESS_ENTRYPOINT: ${{ github.workspace }}/.runtime/harness/dist/cli.js
      - run: |
          npm run bundle
          git diff --exit-code -- bundle
      - name: Verify generated contracts are committed
        run: |
          npm run schemas
          npm run contract
          git diff --exit-code -- schemas installation-contract.json
      # Legacy integration above keeps runtime.json's pin. The opt-in Temporal
      # executor uses the newer immutable action input contract.
      - name: Load pinned Temporal Harness action metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: c8882950c7a267ae99937aaa048de22e6ecd7492
          path: .runtime/harness
          persist-credentials: false
      - name: Validate Actions syntax with pinned actionlint
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml templates/factory-manager*.yml templates/factory-deploy.yml
      - run: npm audit --audit-level=moderate
