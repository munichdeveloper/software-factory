name: CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions: {}
jobs:
  temporal-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build fresh credential-free runtime package
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: docker build --build-arg "FACTORY_SHA=$FACTORY_SHA" -f operations/temporal-runtime/Dockerfile -t sf-temporal-package:ci .
      - name: Verify packaged manifest and produce immutable worker bundle offline
        env:
          FACTORY_SHA: ${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint node sf-temporal-package:ci -e 'const a=require("node:assert/strict"),p=require("./package.json"),m=require("./temporal-runtime.json");a.equal(p.version,m.factoryVersion);a.equal(m.harness.ref,"f70d11556075e9764d69ac03e029720d12ccef65");a.equal(m.experimental,true)'
          docker run --rm --network none sf-temporal-package:ci pack --output /tmp/worker-package --factory-sha "$FACTORY_SHA" --harness-sha f70d11556075e9764d69ac03e029720d12ccef65 --harness /app/.runtime/harness/dist/cli.js --deployment sf-rc-package --build "$FACTORY_SHA" --queue sf-rc-package
  temporal-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: 8f1732c05c351af32bd25a6306a92f3bb06c1bad
          path: .runtime/harness
          persist-credentials: false
      - name: Fresh Temporal cluster, real Harness, worker crash and approval recovery
        run: python3 scripts/test-runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: temporal-runtime-evidence
          path: .runtime/runtime-acceptance/result.json
          if-no-files-found: ignore
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: munichdeveloper/software-factory
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - id: runtime
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'ref=' + require('./runtime.json').ref + '\n')"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: ${{ steps.runtime.outputs.ref }}
          path: .runtime/harness
          persist-credentials: false
      - working-directory: .runtime/harness
        run: |
          npm ci --ignore-scripts
          npm run build
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run test:integration
        env:
          HARNESS_ENTRYPOINT: ${{ github.workspace }}/.runtime/harness/dist/cli.js
      - run: |
          npm run bundle
          git diff --exit-code -- bundle
      - name: Verify generated contracts are committed
        run: |
          npm run schemas
          npm run contract
          git diff --exit-code -- schemas installation-contract.json
      # Legacy integration above keeps runtime.json's pin. The opt-in Temporal
      # executor uses the newer immutable action input contract.
      - name: Load pinned Temporal Harness action metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: f70d11556075e9764d69ac03e029720d12ccef65
          path: .runtime/harness
          persist-credentials: false
      - name: Validate Actions syntax with pinned actionlint
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml templates/factory-manager*.yml templates/factory-deploy.yml
      - run: npm audit --audit-level=moderate
