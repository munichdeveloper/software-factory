name: Temporal isolated coding executor
on:
  workflow_call:
    inputs:
      factory-ref:
        type: string
        required: true
      harness-ref:
        type: string
        required: true
      request:
        type: string
        required: true
      validation:
        type: string
        required: false
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: true
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      request: ${{ steps.request.outputs.request }}
      execution-id: ${{ steps.request.outputs.execution-id }}
      base-sha: ${{ steps.request.outputs.base-sha }}
      validation: ${{ steps.request.outputs.validation }}
    steps:
      - name: Validate immutable runtime references
        shell: bash
        env:
          FACTORY_REF: ${{ inputs.factory-ref }}
          HARNESS_REF: ${{ inputs.harness-ref }}
        run: |
          [[ "$FACTORY_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HARNESS_REF" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/software-factory
          ref: ${{ inputs.factory-ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - id: request
        env:
          SF_CODING_REQUEST: ${{ inputs.request }}
          SF_VALIDATION_PLAN: ${{ inputs.validation }}
        run: node bundle/factory.cjs validate-coding-execution
  code:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.base-sha }}
          path: target
          persist-credentials: false
      # Read-only context named by the broker: commits of this repository only, fetched before the network is closed.
      # The request was validated above; each value is matched again here and never interpreted by a shell.
      - name: Fetch task context before network-isolated coding
        working-directory: target
        timeout-minutes: 5
        env:
          SF_CODING_REQUEST: ${{ needs.validate.outputs.request }}
          SF_BASE_SHA: ${{ needs.validate.outputs.base-sha }}
          SF_FETCH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SF_FETCH_TOKEN" | base64 -w0)"
          fetch() { timeout 120 git -c "http.https://github.com/.extraheader=$auth" fetch --quiet --no-tags --depth=50 origin "$1"; }
          jq -r '.task.contextReferences[]' <<<"$SF_CODING_REQUEST" | grep -E '^sf-context (ref|rework) [a-f0-9]{40}( |$)' | head -n 7 > "$RUNNER_TEMP/sf-context.txt" || true
          [[ -s "$RUNNER_TEMP/sf-context.txt" ]] || exit 0
          fetch "$SF_BASE_SHA" || true
          while read -r _ kind commit _; do
            if ! fetch "$commit"; then echo "Context commit $commit is unavailable"; continue; fi
            git update-ref "refs/sf-context/$commit" "$commit"
            echo "Fetched context commit $commit ($kind)"
            [[ "$kind" == rework ]] || continue
            # Continue from the previous attempt: its changes on the current base, uncommitted. On any conflict the
            # workspace stays at the base and the commit remains available as context.
            if git -c user.name=sf -c user.email=sf@invalid merge --squash --no-commit "$commit" >/dev/null 2>&1; then
              git reset --quiet
              echo "Applied the previous attempt to the workspace"
            else
              git reset --quiet --hard "$SF_BASE_SHA"; git clean --quiet -fd
              echo "The previous attempt does not apply to the current base; it is available as a commit only"
            fi
          done < "$RUNNER_TEMP/sf-context.txt"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: ${{ inputs.harness-ref }}
          path: .runtime/harness
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Prepare locked npm dependencies before network-isolated coding
        if: ${{ hashFiles('target/package-lock.json') != '' }}
        working-directory: target
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: codex
        uses: ./.runtime/harness
        with:
          request: ${{ needs.validate.outputs.request }}
          execution-id: ${{ needs.validate.outputs.execution-id }}
          workspace: ${{ github.workspace }}/target
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          trusted-bot-users: munichdeveloper-sf-manager-local[bot]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-result-${{ needs.validate.outputs.execution-id }}
          path: ${{ steps.codex.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7
  independent-validation:
    needs: [validate, code]
    if: inputs.validation != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/temporal-artifact-validator.yml
    with:
      factory-ref: ${{ inputs.factory-ref }}
      request: ${{ needs.validate.outputs.request }}
      validation: ${{ needs.validate.outputs.validation }}
      source-run-id: ${{ github.run_id }}
