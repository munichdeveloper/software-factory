name: Temporal isolated coding executor
on:
  workflow_call:
    inputs:
      factory-ref:
        type: string
        required: true
      harness-ref:
        type: string
        required: true
      request:
        type: string
        required: true
      validation:
        type: string
        required: false
        default: ''
    secrets:
      # The key of the agent the request names (workers.coding.agent); the harness requires that one. With
      # workers.coding.agents the validate job also uses both keys for a minimal credit check per agent.
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      # OAuth token of a Claude subscription (claude setup-token) for an agent with credential subscription: probed and
      # handed to the harness only when the agents before it in the list had no credit.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
permissions: {}
jobs:
  validate:
    runs-on: ${{ vars.SF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      request: ${{ steps.request.outputs.request }}
      execution-id: ${{ steps.request.outputs.execution-id }}
      base-sha: ${{ steps.request.outputs.base-sha }}
      validation: ${{ steps.request.outputs.validation }}
      credential: ${{ steps.request.outputs.credential }}
    steps:
      - name: Validate immutable runtime references
        shell: bash
        env:
          FACTORY_REF: ${{ inputs.factory-ref }}
          HARNESS_REF: ${{ inputs.harness-ref }}
        run: |
          [[ "$FACTORY_REF" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HARNESS_REF" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/software-factory
          ref: ${{ inputs.factory-ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      # With a priority list the first agent whose provider still has credit is chosen here; the keys stay in this step.
      - id: request
        env:
          SF_CODING_REQUEST: ${{ inputs.request }}
          SF_VALIDATION_PLAN: ${{ inputs.validation }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_VERSION: '2.1.318' # keep equal to the harness's Claude Code version
        run: node bundle/factory.cjs validate-coding-execution --output coding-agent.json
      # The broker reads the choice to name the agent and to alert on used-up credit, also when no agent could run.
      - if: ${{ always() && hashFiles('coding-agent.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-agent-${{ fromJSON(inputs.request).executionId }}
          path: coding-agent.json
          if-no-files-found: ignore
          retention-days: 7
  code:
    needs: validate
    runs-on: ${{ vars.SF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate.outputs.base-sha }}
          path: target
          persist-credentials: false
      # Read-only context named by the broker: commits of this repository only, fetched before the network is closed.
      # The request was validated above; each value is matched again here and never interpreted by a shell.
      - name: Fetch task context before network-isolated coding
        working-directory: target
        timeout-minutes: 5
        env:
          SF_CODING_REQUEST: ${{ needs.validate.outputs.request }}
          SF_BASE_SHA: ${{ needs.validate.outputs.base-sha }}
          SF_FETCH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SF_FETCH_TOKEN" | base64 -w0)"
          fetch() { timeout 120 git -c "http.https://github.com/.extraheader=$auth" fetch --quiet --no-tags --depth=50 origin "$1"; }
          jq -r '.task.contextReferences[]' <<<"$SF_CODING_REQUEST" | grep -E '^sf-context (ref|rework) [a-f0-9]{40}( |$)' | head -n 7 > "$RUNNER_TEMP/sf-context.txt" || true
          [[ -s "$RUNNER_TEMP/sf-context.txt" ]] || exit 0
          fetch "$SF_BASE_SHA" || true
          while read -r _ kind commit _; do
            if ! fetch "$commit"; then echo "Context commit $commit is unavailable"; continue; fi
            git update-ref "refs/sf-context/$commit" "$commit"
            echo "Fetched context commit $commit ($kind)"
            [[ "$kind" == rework ]] || continue
            # Continue from the previous attempt: its changes on the current base, uncommitted. Where they conflict with
            # the base, the files keep git's conflict markers for the worker to resolve (a merge-conflict rework); the
            # commit remains available as context. Anything else that fails leaves the workspace at the base.
            if git -c user.name=sf -c user.email=sf@invalid merge --squash --no-commit "$commit" >/dev/null 2>&1; then
              git reset --quiet
              echo "Applied the previous attempt to the workspace"
            elif conflicted="$(git diff --name-only --diff-filter=U)" && [[ -n "$conflicted" ]]; then
              git reset --quiet
              echo "Applied the previous attempt with conflict markers in: $(tr '\n' ' ' <<<"$conflicted")"
            else
              git reset --quiet --hard "$SF_BASE_SHA"; git clean --quiet -fd
              echo "The previous attempt does not apply to the current base; it is available as a commit only"
            fi
          done < "$RUNNER_TEMP/sf-context.txt"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: munichdeveloper/dev-agent-harness
          ref: ${{ inputs.harness-ref }}
          path: .runtime/harness
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Prepare locked npm dependencies before network-isolated coding
        if: ${{ hashFiles('target/package-lock.json') != '' }}
        working-directory: target
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Opt-in per repository (workers.coding.loopback), passed on by the broker: local servers and browser tests for the worker.
      - id: sandbox
        env:
          SF_CODING_REQUEST: ${{ needs.validate.outputs.request }}
        run: |
          loopback=false
          if jq -e '.task.contextReferences | index("sf-context sandbox loopback")' <<<"$SF_CODING_REQUEST" >/dev/null; then loopback=true; fi
          echo "loopback=$loopback" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Prepare the locked Playwright browser before network-isolated coding
        if: ${{ steps.sandbox.outputs.loopback == 'true' && hashFiles('target/node_modules/playwright/cli.js') != '' }}
        working-directory: target
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sf-browsers
        run: |
          node node_modules/playwright/cli.js install chromium
          echo "path=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_OUTPUT"
      - id: agent
        uses: ./.runtime/harness
        with:
          loopback: ${{ steps.sandbox.outputs.loopback }}
          browser-cache: ${{ steps.browsers.outputs.path }}
          request: ${{ needs.validate.outputs.request }}
          execution-id: ${{ needs.validate.outputs.execution-id }}
          workspace: ${{ github.workspace }}/target
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Exactly one Claude credential: the subscription's OAuth token when the validate job chose it, else the API key.
          anthropic-api-key: ${{ needs.validate.outputs.credential != 'subscription' && secrets.ANTHROPIC_API_KEY || '' }}
          claude-oauth-token: ${{ needs.validate.outputs.credential == 'subscription' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          trusted-bot-users: munichdeveloper-sf-manager-local[bot]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-result-${{ needs.validate.outputs.execution-id }}
          path: ${{ steps.agent.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7
      # Token usage of the run (harness usage.json), also when the agent failed, timed out or hit its spend cap.
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coding-usage-${{ needs.validate.outputs.execution-id }}
          path: ${{ runner.temp }}/harness-${{ needs.validate.outputs.execution-id }}/usage.json
          if-no-files-found: ignore
          retention-days: 30
  independent-validation:
    needs: [validate, code]
    if: inputs.validation != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/temporal-artifact-validator.yml
    with:
      factory-ref: ${{ inputs.factory-ref }}
      request: ${{ needs.validate.outputs.request }}
      validation: ${{ needs.validate.outputs.validation }}
      source-run-id: ${{ github.run_id }}
