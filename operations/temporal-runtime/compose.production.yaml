# Production stack of the Software Factory runtime and SF Manager on the Docker host.
# Deployed by the Factory's own docker-ssh deployment (.github/software-factory.yml): the broker is
# built from the release that is being deployed; SF_RELEASE_SHA is set by the deployment.
#
# Host state that never passes through GitHub lives in SFM_CONFIG_DIR (default: the deploy path):
#   .env            SFM_HOST (public host name of the Manager, read by the Manager's own deployment)
#   *.env           service credentials
#   registry.json   runtime registry (repositories, modes; its release entry is superseded, see below)
# Secrets kept in GitHub reach the stack through the deployment's .sf-deploy.env (see runtime-broker).
name: sfm
# The PINNED worker release. Changing it is the release rollout on this host: the deployment builds the worker
# image and its package from this published Factory commit, and the broker serves its repositories with exactly
# that release. Nothing on the host has to be edited. Installed repositories still need their executor wrapper
# rolled to the same commit (SF Manager), and runs of the previous release (PREVIOUS_WORKER_FACTORY_SHA) keep running on their own worker.
# The SF Manager (web and job worker) is deployed by its own repository, munichdeveloper/sf-manager
# (operations/image/compose.yaml), together with its database, and reaches the broker here through the runtime-api network.
# Only a published release may be named here, and only together with the rollout of that same release to the
# installed repositories: the broker refuses every run whose executor wrapper pins a different commit
# (EXECUTOR_WRAPPER_RELEASE_MISMATCH). The SF Manager rolls out published releases only.
# PREVIOUS_WORKER_FACTORY_SHA is the release this one replaced: a host rollout moves the old WORKER_FACTORY_SHA here.
# Its worker (runtime-worker-previous) only finishes runs admitted before the rollout, so a rollout never waits for open
# runs and never unbinds a repository; the broker ends such a run after FACTORY_RETAINED_RUN_HOURS (default 2) and the
# planner retries it on the current release (software-factory#102). It may equal WORKER_FACTORY_SHA.
x-worker-release: &worker-release
  WORKER_FACTORY_SHA: 726e6d54e61a335b1427dcdaebe87895fc9ccda7
  PREVIOUS_WORKER_FACTORY_SHA: acd9e4aa1da38c8762f1a6b0b01759047e9b8f11
  WORKER_DEPLOYMENT: sf-backofficer
  WORKER_QUEUE: sf-backofficer-v1
x-service: &service
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }
services:
  runtime-db:
    <<: *service
    # Clients that share runtime-broker's network namespace lose it whenever a deploy recreates the broker, under
    # their open connections and without closing them; TCP keepalives let
    # Postgres drop such dead connections after about 90 seconds instead of two hours (max_connections ran out).
    command: [postgres, -c, tcp_keepalives_idle=60, -c, tcp_keepalives_interval=10, -c, tcp_keepalives_count=3]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    env_file: ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/runtime-db.env
    volumes: [runtime-data:/var/lib/postgresql/data]
    networks: [private]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U factory -d factory_runtime]
      interval: 5s
      timeout: 3s
      retries: 20
  runtime-broker:
    <<: *service
    build:
      context: .
      dockerfile: operations/temporal-runtime/Dockerfile
      target: broker
      args:
        <<: *worker-release
        FACTORY_SHA: ${SF_RELEASE_SHA:?}
    read_only: true
    # .sf-deploy.env is written by the deployment from the wrapper's deploy-env (GitHub secrets, e.g. the merge
    # review key OPENAI_API_KEY); it overrides the host's broker.env and is empty when no secret is passed.
    env_file:
      - ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/broker.env
      - .sf-deploy.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # Besides loopback the broker listens only on its address in runtime-api (this alias exists only there), so
      # the SF Manager's own Compose project reaches http://runtime-broker:8095 and the Temporal network does not.
      FACTORY_RUNTIME_LISTEN_ALIAS: factory-runtime-api
      # Self-hosted runner fallback (software-factory#110, docs/self-hosted-runners.md). Needs the GitHub App permissions
      # Administration and Variables write (granted 2026-11-17).
      FACTORY_RUNNER_FALLBACK: 'on'
      FACTORY_RUNNER_SLOTS_DIR: /run/factory/runners
      FACTORY_RUNNER_ALERT_CHANNEL: C0CGJKK3EKS # ki-notification
      # Private repositories outside the registry whose own CI follows SF_RUNNER (id:owner/name).
      FACTORY_RUNNER_REPOSITORIES: 1449777386:munichdeveloper/sf-manager,1448658563:munichdeveloper/business-os
    volumes:
      - '${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/registry.json:/run/factory/registry.json:ro'
      # One directory per runner slot: the broker writes a just-in-time configuration, the slot's runner takes it.
      - runner-slot-1:/run/factory/runners/1
      - runner-slot-2:/run/factory/runners/2
    tmpfs: [/tmp]
    networks:
      private: {}
      temporal: {}
      runtime-api: { aliases: [factory-runtime-api] }
    mem_limit: 1g
    depends_on:
      runtime-db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
  runtime-worker:
    <<: *service
    build:
      context: .
      dockerfile: operations/temporal-runtime/Dockerfile
      target: worker
      args: *worker-release
    network_mode: service:runtime-broker
    read_only: true
    env_file: ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/worker.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: software-factory-backofficer
      FACTORY_BROKER_URL: http://127.0.0.1:8095
    tmpfs: [/tmp]
    mem_limit: 1g
    depends_on:
      runtime-broker: { condition: service_healthy }
  # Same deployment and queue as runtime-worker, pinned to the previous release: Temporal routes the PINNED runs of
  # that build here. Idle once they ended.
  runtime-worker-previous:
    <<: *service
    build:
      context: .
      dockerfile: operations/temporal-runtime/Dockerfile
      target: previous-worker
      args: *worker-release
    network_mode: service:runtime-broker
    read_only: true
    env_file: ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/worker.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: software-factory-backofficer
      FACTORY_BROKER_URL: http://127.0.0.1:8095
    tmpfs: [/tmp]
    mem_limit: 1g
    depends_on:
      runtime-broker: { condition: service_healthy }
  # Self-hosted runner pool (software-factory#110): two slots, each a runner and its own Docker daemon sharing one
  # network namespace, so a job's containers are reachable on localhost as on a hosted runner. The broker hands out
  # work only while the Actions budget is used up and only for private repositories; otherwise the runners idle.
  # Limits keep the pool next to the runtime: per slot 2 CPUs and 5 GB for the job and its containers together.
  # The daemons are privileged (decision of 2026-11-17): a job could take over the host. Nothing of the broker is
  # mounted or reachable here: no network to it, no token; the slot volume only carries one-job configurations.
  runner-docker-1: &runner-docker
    image: docker:29.9.3-dind@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b
    restart: unless-stopped
    privileged: true
    environment: { DOCKER_TLS_CERTDIR: '' }
    command: [dockerd, --host=tcp://127.0.0.1:2375, --host=unix:///var/run/docker.sock, --tls=false]
    volumes: [runner-docker-1:/var/lib/docker, runner-work-1:/home/runner/work]
    networks: [runners]
    cpus: 2
    mem_limit: 5g
    pids_limit: 4096
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
    healthcheck:
      test: [CMD, docker, --host=tcp://127.0.0.1:2375, info]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  runner-1: &runner
    build:
      context: .
      dockerfile: operations/runner/Dockerfile
    restart: unless-stopped
    user: root
    network_mode: service:runner-docker-1
    environment: { DOCKER_HOST: 'tcp://127.0.0.1:2375' }
    # The workspace is shared with the daemon so bind mounts of job files resolve to the same paths.
    volumes: [runner-slot-1:/jit, runner-work-1:/home/runner/work]
    tmpfs: ['/tmp:size=2g']
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }
    depends_on:
      runner-docker-1: { condition: service_healthy }
  runner-docker-2:
    <<: *runner-docker
    volumes: [runner-docker-2:/var/lib/docker, runner-work-2:/home/runner/work]
  runner-2:
    <<: *runner
    network_mode: service:runner-docker-2
    volumes: [runner-slot-2:/jit, runner-work-2:/home/runner/work]
    depends_on:
      runner-docker-2: { condition: service_healthy }
networks:
  private: { internal: true }
  # Shared with the SF Manager's own deployment (munichdeveloper/sf-manager, operations/image/compose.yaml): only
  # the broker API is attached here; the fixed name lets the other project join it.
  runtime-api: { name: sf-runtime-api, internal: true }
  # Traefik's network, which Traefik is attached to; no service here uses it any more, the SF Manager's web service
  # joins it as sfm_front. Declared with its existing name so it stays stable.
  front: { name: sfm_front }
  temporal: { external: true, name: sf-temporal_access }
  # The runner pool's own network with internet access; nothing of the runtime is attached to it.
  runners: {}
# The Manager database and its volume sfm_manager-data belong to the SF Manager's own stack (external volume there).
volumes:
  runtime-data: {}
  runner-slot-1: {}
  runner-slot-2: {}
  runner-docker-1: {}
  runner-docker-2: {}
  runner-work-1: {}
  runner-work-2: {}
