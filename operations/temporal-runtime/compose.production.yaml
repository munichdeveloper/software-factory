# Production stack of the Software Factory runtime and SF Manager on the Docker host.
# Deployed by the Factory's own docker-ssh deployment (.github/software-factory.yml): the broker is
# built from the release that is being deployed; SF_RELEASE_SHA is set by the deployment.
#
# Host state that never passes through GitHub lives in SFM_CONFIG_DIR (default: the deploy path):
#   .env            SFM_HOST (public host name of the Manager, read by the Manager's own deployment)
#   *.env           service credentials
#   registry.json   runtime registry (repositories, modes; its release entry is superseded, see below)
# Secrets kept in GitHub reach the stack through the deployment's .sf-deploy.env (see runtime-broker).
name: sfm
# The PINNED worker release. Changing it is the release rollout on this host: the deployment builds the worker
# image and its package from this published Factory commit, and the broker serves its repositories with exactly
# that release. Nothing on the host has to be edited. Installed repositories still need their executor wrapper
# rolled to the same commit (SF Manager), and a deployment fails closed while a run of another release is active.
# The SF Manager (web and job worker) is deployed by its own repository, munichdeveloper/sf-manager
# (operations/image/compose.yaml), and reaches the broker and its database here through the runtime-api network.
# Only a published release may be named here, and only together with the rollout of that same release to the
# installed repositories: the broker refuses every run whose executor wrapper pins a different commit
# (EXECUTOR_WRAPPER_RELEASE_MISMATCH). The SF Manager rolls out published releases only.
x-worker-release: &worker-release
  WORKER_FACTORY_SHA: 0c386200f43543efceb20eb2c0f21d0a4f6656cc
  WORKER_DEPLOYMENT: sf-backofficer
  WORKER_QUEUE: sf-backofficer-v1
x-service: &service
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }
services:
  manager-db:
    <<: *service
    # Clients that share runtime-broker's network namespace lose it whenever a deploy recreates the broker, under
    # their open connections and without closing them; TCP keepalives let
    # Postgres drop such dead connections after about 90 seconds instead of two hours (max_connections ran out).
    command: [postgres, -c, tcp_keepalives_idle=60, -c, tcp_keepalives_interval=10, -c, tcp_keepalives_count=3]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    env_file: ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/manager-db.env
    volumes: [manager-data:/var/lib/postgresql/data]
    # runtime-api: the SF Manager, deployed by its own repository, reaches its database as manager-db there.
    networks: [private, runtime-api]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sf -d sf_manager]
      interval: 5s
      timeout: 3s
      retries: 20
  runtime-db:
    <<: *service
    # Clients that share runtime-broker's network namespace lose it whenever a deploy recreates the broker, under
    # their open connections and without closing them; TCP keepalives let
    # Postgres drop such dead connections after about 90 seconds instead of two hours (max_connections ran out).
    command: [postgres, -c, tcp_keepalives_idle=60, -c, tcp_keepalives_interval=10, -c, tcp_keepalives_count=3]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: postgres:17.11-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    env_file: ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/runtime-db.env
    volumes: [runtime-data:/var/lib/postgresql/data]
    networks: [private]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, pg_isready -U factory -d factory_runtime]
      interval: 5s
      timeout: 3s
      retries: 20
  runtime-broker:
    <<: *service
    build:
      context: .
      dockerfile: operations/temporal-runtime/Dockerfile
      target: broker
      args:
        <<: *worker-release
        FACTORY_SHA: ${SF_RELEASE_SHA:?}
    read_only: true
    # .sf-deploy.env is written by the deployment from the wrapper's deploy-env (GitHub secrets, e.g. the merge
    # review key OPENAI_API_KEY); it overrides the host's broker.env and is empty when no secret is passed.
    env_file:
      - ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/broker.env
      - .sf-deploy.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # Besides loopback the broker listens only on its address in runtime-api (this alias exists only there), so
      # the SF Manager's own Compose project reaches http://runtime-broker:8095 and the Temporal network does not.
      FACTORY_RUNTIME_LISTEN_ALIAS: factory-runtime-api
    volumes: ['${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/registry.json:/run/factory/registry.json:ro']
    tmpfs: [/tmp]
    networks:
      private: {}
      temporal: {}
      runtime-api: { aliases: [factory-runtime-api] }
    mem_limit: 1g
    depends_on:
      runtime-db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
  runtime-worker:
    <<: *service
    build:
      context: .
      dockerfile: operations/temporal-runtime/Dockerfile
      target: worker
      args: *worker-release
    network_mode: service:runtime-broker
    read_only: true
    env_file: ${SFM_CONFIG_DIR:-/home/deploy/sfm-runtime}/worker.env
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: software-factory-backofficer
      FACTORY_BROKER_URL: http://127.0.0.1:8095
    tmpfs: [/tmp]
    mem_limit: 1g
    depends_on:
      runtime-broker: { condition: service_healthy }
networks:
  private: { internal: true }
  # Shared with the SF Manager's own deployment (munichdeveloper/sf-manager, operations/image/compose.yaml): only
  # the broker API and the Manager database are attached; the fixed name lets the other project join it.
  runtime-api: { name: sf-runtime-api, internal: true }
  # Traefik's network, which Traefik is attached to; no service here uses it any more, the SF Manager's web service
  # joins it as sfm_front. Declared with its existing name so it stays stable.
  front: { name: sfm_front }
  temporal: { external: true, name: sf-temporal_access }
volumes:
  manager-data: {}
  runtime-data: {}
