version: 1
factory:
  enabled: true
  scope: "Coordinate explicitly managed repository tasks; run the non-mutating test worker."
manager:
  workflow: factory-manager.yml
  maxActions: 10
  timeoutMinutes: 15
  maxContextTasks: 20
  maxContextChars: 20000
  trustedActors: ["github-actions[bot]"]
autonomy:
  profile: supervised
  overrides: {}
execution:
  dryRun: false
  maxParallelWorkers: 1
  maxRetries: 2
  maxNewIssues: 3
  workerTimeoutMinutes: 30
  dispatchGraceMinutes: 10
llm:
  provider: mock
  model: gpt-4.1-mini
  reasoningEffort: null
  maxOutputTokens: 4000
  timeoutSeconds: 60
  maxCalls: 1
workers:
  test:
    enabled: true
    operation: sha256
  coding: false
  review: false
reporting:
  persistDecisions: true

# Optional Slack bot connection is supplied through the SLACK_BOT_TOKEN Actions secret.
notifications:
  slack:
    enabled: false
    channel: null
    maxPerRun: 20
    since: null
    events:
      issue_created:
        enabled: false
        channel: null
      pr_merged:
        enabled: false
        channel: null
        actors: [] # Always Bot accounts only; optional narrower login allow-list.
