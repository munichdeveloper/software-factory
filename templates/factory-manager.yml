name: Software Factory
run-name: Factory ${{ github.event_name == 'push' && 'notify' || inputs.mode || 'manager' }} ${{ inputs.execution_id }}
on:
  push:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [manager, notify, check-slack, bootstrap, worker]
        default: manager
      execution_id:
        type: string
        default: ''
      issue_number:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.repository }}-software-factory-${{ inputs.mode == 'worker' && inputs.execution_id || 'manager' }}
  cancel-in-progress: false
jobs:
  factory:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    steps:
      - uses: munichdeveloper/software-factory@FACTORY_COMMIT_SHA
        with:
          mode: ${{ github.event_name == 'push' && 'notify' || inputs.mode || 'manager' }}
          execution-id: ${{ inputs.execution_id || '' }}
          issue-number: ${{ inputs.issue_number || '' }}
          dry-run: ${{ inputs.dry_run || false }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
