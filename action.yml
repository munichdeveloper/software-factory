name: Software Factory
description: Plan, authorize, dispatch and reconcile repository tasks using a separate Harness runtime
inputs:
  mode:
    description: manager, merge, notify, check-slack, bootstrap, worker or deploy
    default: manager
  config-path:
    description: Default-branch SF configuration path
    default: .github/software-factory.yml
  harness-ref:
    description: Immutable independent Harness runtime commit
    default: 8f1732c05c351af32bd25a6306a92f3bb06c1bad
  execution-id:
    description: SF delegation execution identifier
    default: ''
  issue-number:
    description: SF managed task issue number
    default: ''
  dry-run:
    description: Evaluate without repository mutations
    default: 'false'
  github-token:
    description: SF repository API credential, never passed to Harness
    default: ${{ github.token }}
  openai-api-key:
    description: Optional SF planning credential, never passed to Harness
    default: ''
  slack-bot-token:
    description: Optional Slack bot connection; used only by the trusted manager
    default: ''
  deploy-ssh-key:
    description: Deploy mode only. Private SSH key of the deployment user
    default: ''
  deploy-known-hosts:
    description: Deploy mode only. Pinned known_hosts line(s) of the target host
    default: ''
  deploy-host:
    description: Deploy mode only. Target host when deploy.host is not configured
    default: ''
  deploy-user:
    description: Deploy mode only. SSH user when deploy.user is not configured
    default: ''
  deploy-port:
    description: Deploy mode only. SSH port when deploy.port is not configured
    default: ''
runs:
  using: composite
  steps:
    - name: Validate invocation
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        REF: ${{ inputs.harness-ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        [[ "$MODE" == manager || "$MODE" == merge || "$MODE" == notify || "$MODE" == check-slack || "$MODE" == bootstrap || "$MODE" == worker || "$MODE" == deploy ]]
        [[ "$REF" =~ ^[a-f0-9]{40}$ ]]
        [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
    - if: inputs.mode == 'worker'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: munichdeveloper/dev-agent-harness
        ref: ${{ inputs.harness-ref }}
        path: .runtime/harness
        persist-credentials: false
    - if: inputs.mode == 'worker'
      shell: bash
      working-directory: .runtime/harness
      run: |
        npm ci --ignore-scripts
        npm run build
    - name: Run Software Factory
      if: inputs.mode != 'deploy'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ (inputs.mode == 'manager' || inputs.mode == 'merge') && inputs.openai-api-key || '' }}
        SLACK_BOT_TOKEN: ${{ (inputs.mode == 'manager' || inputs.mode == 'notify' || inputs.mode == 'check-slack') && inputs.slack-bot-token || '' }}
        HARNESS_EXECUTION_ID: ${{ inputs.execution-id }}
        HARNESS_ISSUE_NUMBER: ${{ inputs.issue-number }}
        MODE: ${{ inputs.mode }}
        CONFIG: ${{ inputs.config-path }}
        DRY_RUN: ${{ inputs.dry-run }}
        SF_SANITY_REPORT: ${{ runner.temp }}/sf-sanity.json
      run: |
        export HARNESS_ENTRYPOINT="$GITHUB_WORKSPACE/.runtime/harness/dist/cli.js"
        args=()
        if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
        node "$GITHUB_ACTION_PATH/bundle/factory.cjs" "$MODE" --config-path "$CONFIG" "${args[@]}"
    - name: Upload mutation-free manager result
      if: inputs.dry-run == 'true' && inputs.mode == 'manager'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sf-sanity-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sf-sanity.json
        if-no-files-found: error
        retention-days: 7
    - name: Plan deployment
      id: deploy-plan
      if: inputs.mode == 'deploy'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CONFIG: ${{ inputs.config-path }}
        DRY_RUN: ${{ inputs.dry-run }}
        DEPLOY_SSH_KEY: ${{ inputs.deploy-ssh-key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.deploy-known-hosts }}
        DEPLOY_HOST: ${{ inputs.deploy-host }}
        DEPLOY_USER: ${{ inputs.deploy-user }}
        DEPLOY_PORT: ${{ inputs.deploy-port }}
      run: |
        args=()
        if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
        node "$GITHUB_ACTION_PATH/bundle/factory.cjs" deploy-plan --config-path "$CONFIG" "${args[@]}"
    - if: inputs.mode == 'deploy' && steps.deploy-plan.outputs.deploy == 'true'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ steps.deploy-plan.outputs.sha }}
        path: .runtime/deploy-source
        token: ${{ inputs.github-token }}
        persist-credentials: false
    - name: Deploy
      if: inputs.mode == 'deploy' && steps.deploy-plan.outputs.deploy == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CONFIG: ${{ inputs.config-path }}
        SHA: ${{ steps.deploy-plan.outputs.sha }}
        DEPLOY_SSH_KEY: ${{ inputs.deploy-ssh-key }}
        DEPLOY_KNOWN_HOSTS: ${{ inputs.deploy-known-hosts }}
        DEPLOY_HOST: ${{ inputs.deploy-host }}
        DEPLOY_USER: ${{ inputs.deploy-user }}
        DEPLOY_PORT: ${{ inputs.deploy-port }}
      run: node "$GITHUB_ACTION_PATH/bundle/factory.cjs" deploy --config-path "$CONFIG" --sha "$SHA" --source "$GITHUB_WORKSPACE/.runtime/deploy-source"
